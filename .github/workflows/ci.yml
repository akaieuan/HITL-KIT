name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build @hitl-kit/* packages first so their dist/ exists. Each
      # adapter typechecks against its dependent's published types
      # (resolved via "types" / "exports" in package.json), so a fresh
      # CI checkout needs these built before tsc can resolve them.
      - name: Build @hitl-kit/* packages
        run: pnpm packages:build

      - name: Typecheck root
        run: pnpm typecheck

      - name: Typecheck @hitl-kit/* packages
        run: pnpm packages:typecheck

      - name: Tests
        run: pnpm test

  audit:
    name: Dependency audit (fail on high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fail on high or critical)
        run: pnpm audit --audit-level high
